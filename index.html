<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>課題分析シート入力</title>
<style>
  :root{
    --bg:#F5F5F7;
    --surface:#FFFFFF;
    --ink:#241F2E;
    --ink-soft:#655B6B;
    --accent:#6E4F9E;
    --accent-deep:#3E2D5C;
    --accent-soft:#E7E1F0;
    --line:#DEDAE2;
    --warn:#B5502A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:96px;
  }

  header{
    position:sticky; top:0; z-index:20;
    background:var(--accent-deep);
    color:#F6F4F9;
    padding:14px 18px 10px;
  }
  header h1{margin:0; font-size:19px; font-weight:700; letter-spacing:.02em;}
  header p{margin:2px 0 10px; font-size:12.5px; color:#D3C7E4;}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto; padding:9px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08); color:#EFE9F5; font-size:13px; white-space:nowrap;
  }
  .tab-btn.active{background:#F6F4F9; color:var(--accent-deep); border-color:#F6F4F9; font-weight:700;}

  main{padding:16px 14px 20px; max-width:760px; margin:0 auto;}
  .section{display:none;}
  .section.active{display:block; animation:fade .2s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px 16px 14px; margin-bottom:14px;
  }
  .field-label{
    font-size:13.5px; font-weight:700; color:var(--accent-deep);
    white-space:pre-line; line-height:1.5; margin-bottom:6px;
  }
  input[type=text], textarea, select{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 12px;
    font-size:15.5px; font-family:inherit; color:var(--ink); background:#FDFCFE;
    resize:vertical; line-height:1.6;
  }
  select{
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24'><path fill='%236E4F9E' d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:34px; min-height:46px;
  }
  .sub-note{margin-top:8px;}
  textarea{min-height:90px;}
  input[type=text]:focus, textarea:focus, select:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
  }
  .section-title{
    font-size:15px; font-weight:700; color:var(--accent-deep);
    margin:4px 0 10px; padding-left:10px; border-left:5px solid var(--accent);
  }
  .group-title{
    font-size:15px; font-weight:700; color:var(--accent-deep);
    margin:18px 0 10px; padding-left:10px; border-left:5px solid var(--accent);
  }

  .navbar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:8px;
  }
  .navbar .status{flex:1; font-size:12.5px; color:var(--ink-soft); line-height:1.4;}
  .navbar .status.ok{color:var(--accent-deep); font-weight:700;}
  .navbar .status.err{color:var(--warn); font-weight:700;}
  button.pill{border:none; border-radius:12px; padding:13px 16px; font-size:14.5px; font-weight:700; min-height:48px;}
  #previewBar button.pill{padding:12px 8px; font-size:13px; line-height:1.3;}
  .btn-main{background:var(--accent); color:#fff;}
  .btn-main:active{background:var(--accent-deep);}
  .btn-ghost{background:var(--accent-soft); color:var(--accent-deep);}
  .btn-print{background:#EFE7D6; color:#6B4E1A;}

  #previewView{background:#fff; border-radius:14px; padding:4px 0 20px;}
  .preview-group{
    font-size:15px; font-weight:700; color:var(--accent-deep);
    margin:18px 0 10px; padding-left:10px; border-left:5px solid var(--accent);
  }
  .preview-item{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:10px;
  }
  .preview-item .p-label{font-size:13px; font-weight:700; color:var(--accent-deep); white-space:pre-line; margin-bottom:4px;}
  .preview-item .p-value{font-size:14.5px; white-space:pre-line; line-height:1.6; color:var(--ink);}
  .preview-item .p-value.empty{color:var(--ink-soft); font-style:italic;}

  .draw-wrap{
    position:relative; width:520px; max-width:100%; height:280px;
    min-width:240px; min-height:190px;
    overflow:hidden;
    border:1px solid var(--line); border-radius:10px;
    background:#FDFCFE;
  }
  .draw-wrap canvas{display:block; width:100%; height:100%; touch-action:none;}
  .draw-resize-handle{
    position:absolute; right:0; bottom:0; width:26px; height:26px;
    cursor:nwse-resize; touch-action:none; z-index:5;
    background:
      linear-gradient(135deg, transparent 0 45%, var(--accent) 45% 55%, transparent 55% 100%),
      linear-gradient(135deg, transparent 0 65%, var(--accent) 65% 75%, transparent 75% 100%);
    opacity:.55;
  }
  .draw-resize-handle:hover, .draw-resize-handle:active{opacity:.9;}
  .draw-toolbar{display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .draw-clear-btn{
    border:1px solid var(--line); border-radius:8px; background:var(--accent-soft);
    color:var(--accent-deep); font-size:12.5px; font-weight:700; padding:7px 12px; cursor:pointer;
  }
  .draw-hint{font-size:11.5px; color:var(--ink-soft); width:100%;}
  .draw-shape-toggle{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--accent-deep); font-weight:700; cursor:pointer;}
  .draw-shape-toggle input{width:15px; height:15px; margin:0;}
  .p-draw-img{max-width:100%; border:1px solid var(--line); border-radius:8px; display:block;}
</style>
</head>
<body>

<header>
  <h1>課題分析シート入力</h1>
  <p>とちぎ版・課題分析のための情報収集シート／タップして入力 → 保存でスプレッドシートへ記録</p>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div id="inputRoot">

    <div class="card">
      <div class="field-label">ホーム</div>
      <select id="a_home"><option value="">選択してください</option></select>
    </div>
    <div class="card">
      <div class="field-label">氏名</div>
      <select id="a_name"><option value="">先にホームを選択してください</option></select>
    </div>
    <div class="card">
      <div class="field-label">区分</div>
      <select id="a_category">
        <option value="">選択してください</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>

    <!-- 基本情報（課題分析シート） -->
    <div class="section active" data-section="0">
      <div class="section-title">基本情報（課題分析シート）</div>
      <div id="basic2Container"></div>
    </div>

    <!-- 生活課題分析23項目 -->
    <div class="section" data-section="1">
      <div class="section-title">生活課題分析（23項目）</div>
      <div id="lifeContainer"></div>
    </div>
  </div>

  <!-- 内容確認ビュー -->
  <div id="previewView" style="display:none;">
    <div id="previewBar" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
      <button class="pill btn-ghost" onclick="closePreview()" style="width:100%;">入力に戻る</button>
      <button class="pill btn-print" onclick="exportExcel()" style="width:100%;">Excel出力</button>
    </div>
    <div id="previewContent"></div>
  </div>
</main>

<div class="navbar">
  <div class="status" id="status">未保存</div>
  <button class="pill btn-print" onclick="showPreview()">内容確認</button>
  <button class="pill btn-main" onclick="saveData()">保存</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
// ここに発行されたGAS Web AppのURLを直接書き込んでおくと、毎回貼らずに済みます
// ICF入力アプリと同じURLを指定してください
const CONFIG = {
  WEBAPP_URL: "https://script.google.com/macros/s/AKfycbwiDr1rX948ZM0WT6wrfkhfNUlf_Sn8K2tCPZiwdxvLr1SBNDQgj8jbn0LdARIIPm0/exec"
};

const sectionNames = ["基本情報","生活課題分析"];
const tabsEl = document.getElementById('tabs');
sectionNames.forEach((name, i) => {
  const b = document.createElement('button');
  b.className = 'tab-btn' + (i===0 ? ' active' : '');
  b.textContent = name;
  b.onclick = () => showSection(i);
  tabsEl.appendChild(b);
});

function showSection(i){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelector(`.section[data-section="${i}"]`).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', idx===i));
  window.scrollTo({top:0, behavior:'smooth'});
}

  ]

(function initHomeSelect(){
  const homeEl = document.getElementById('a_home');
  Object.keys(HOME_RESIDENTS).forEach(home => {
    const opt = document.createElement('option');
    opt.value = home;
    opt.textContent = home;
    homeEl.appendChild(opt);
  });
  homeEl.addEventListener('change', updateNameOptions);
})();

function updateNameOptions(){
  const home = document.getElementById('a_home').value;
  const nameEl = document.getElementById('a_name');
  nameEl.innerHTML = '';
  if(!home){
    nameEl.innerHTML = '<option value="">先にホームを選択してください</option>';
    clearAllAssessmentFields();
    return;
  }
  nameEl.innerHTML = '<option value="">選択してください</option>';
  HOME_RESIDENTS[home].forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.name;
    opt.textContent = r.name;
    opt.dataset.category = r.category;
    nameEl.appendChild(opt);
  });
  clearAllAssessmentFields();
}

document.getElementById('a_name').addEventListener('change', function(){
  const selected = this.options[this.selectedIndex];
  const category = selected ? selected.dataset.category : '';
  if(category){
    document.getElementById('a_category').value = category;
  }
  loadAssessmentData(this.value);
});

      html += '<textarea class="sub-note" id="' + f.id + '_note" placeholder="補足・具体的な状況を入力"></textarea>';
    }

            '<div class="draw-resize-handle" id="' + f.id + '_handle"></div></div>';

  html += '</div>';
  return html;

const canvasHasContent = {};

function rdpSimplify(points, epsilon){
  function perpDist(p, a, b){
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    if(len < 1e-9) return Math.hypot(p.x - a.x, p.y - a.y);
    return Math.abs((p.x - a.x) * dy - (p.y - a.y) * dx) / len;
  }
  function rec(pts){
    if(pts.length < 3) return pts;
    let maxDist = 0, idx = 0;
    const a = pts[0], b = pts[pts.length - 1];
    for(let i = 1; i < pts.length - 1; i++){
      const d = perpDist(pts[i], a, b);
      if(d > maxDist){ maxDist = d; idx = i; }
    }
    if(maxDist > epsilon){
      const left = rec(pts.slice(0, idx + 1));
      const right = rec(pts.slice(idx));
      return left.slice(0, -1).concat(right);
    }
    return [a, b];
  }
  return rec(points);
}

function classifyStroke(points, dpr){
  if(points.length < 10) return null;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  points.forEach(p => {
    if(p.x < minX) minX = p.x;
    if(p.x > maxX) maxX = p.x;
    if(p.y < minY) minY = p.y;
    if(p.y > maxY) maxY = p.y;
  });
  const w = maxX - minX, h = maxY - minY;
  if(w < 16 * dpr || h < 16 * dpr) return null;

  const first = points[0], last = points[points.length - 1];
  const closeDist = Math.hypot(last.x - first.x, last.y - first.y);
  if(closeDist > 0.35 * Math.max(w, h)) return null;

  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const rx = w / 2, ry = h / 2;
  const eps = 0.06 * Math.max(w, h);
  const simplified = rdpSimplify(points, eps);
  const vertexCount = simplified.length - 1;

  if(vertexCount >= 6){
    let variance = 0;
    points.forEach(p => {
      const nx = (p.x - cx) / rx, ny = (p.y - cy) / ry;
      const d = Math.hypot(nx, ny);
      variance += (d - 1) * (d - 1);
    });
    variance /= points.length;
    if(variance > 0.09) return null;

    let angleSum = 0, prevAngle = null;
    points.forEach(p => {
      const a = Math.atan2(p.y - cy, p.x - cx);
      if(prevAngle !== null){
        let da = a - prevAngle;
        while(da > Math.PI) da -= Math.PI * 2;
        while(da < -Math.PI) da += Math.PI * 2;
        angleSum += da;
      }
      prevAngle = a;
    });
    if(Math.abs(angleSum) < Math.PI * 1.3) return null;

    return { type: 'ellipse', cx, cy, rx, ry };
  }

  if(vertexCount === 3){
    return { type: 'triangle', points: simplified.slice(0, 3) };
  }

  if(vertexCount === 4){
    const verts = simplified.slice(0, 4);
    let axisScore = 0, diagScore = 0;
    for(let i = 0; i < 4; i++){
      const a = verts[i], b = verts[(i + 1) % 4];
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      let deg = Math.abs(ang * 180 / Math.PI) % 90;
      if(deg > 45) deg = 90 - deg;
      if(deg < 22.5) axisScore++; else diagScore++;
    }
    if(axisScore >= 3) return { type: 'rect', cx, cy, rx, ry };
    if(diagScore >= 3) return { type: 'diamond', cx, cy, rx, ry };
    return { type: 'polygon', points: verts };
  }

  return null;
}

function initCanvasField(id){
  const wrap = document.getElementById(id + '_wrap');
  const canvas = document.getElementById(id + '_canvas');
  if(!wrap || !canvas) return;
  const ctx = canvas.getContext('2d');

  function resizeCanvas(preserve){
    const rect = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const newW = Math.max(1, Math.round(rect.width * dpr));
    const newH = Math.max(1, Math.round(rect.height * dpr));
    if(canvas.width === newW && canvas.height === newH) return;
    let prevImg = null;
    if(preserve && canvas.width > 0 && canvas.height > 0){
      prevImg = document.createElement('canvas');
      prevImg.width = canvas.width;
      prevImg.height = canvas.height;
      prevImg.getContext('2d').drawImage(canvas, 0, 0);
    }
    canvas.width = newW;
    canvas.height = newH;
    ctx.fillStyle = '#FDFCFE';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#3E2D5C';
    ctx.lineWidth = 2.5 * dpr;
    if(prevImg){
      ctx.drawImage(prevImg, 0, 0, prevImg.width, prevImg.height, 0, 0, canvas.width, canvas.height);
    }
  }
  resizeCanvas(false);
  requestAnimationFrame(() => resizeCanvas(true));

  if(window.ResizeObserver){
    new ResizeObserver(() => resizeCanvas(true)).observe(wrap);
  } else {
    window.addEventListener('resize', () => resizeCanvas(true));
  }

  let drawing = false, lastX = 0, lastY = 0;
  let strokePoints = [], strokeSnapshot = null;
  const shapeAssistBox = document.getElementById(id + '_shapeAssist');
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    return { x: (e.clientX - rect.left) * dpr, y: (e.clientY - rect.top) * dpr };
  }
  function drawPolygon(pts){
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.stroke();
  }
  function finishStroke(){
    if(shapeAssistBox && shapeAssistBox.checked && strokeSnapshot){
      const dpr = window.devicePixelRatio || 1;
      const shape = classifyStroke(strokePoints, dpr);
      if(shape){
        ctx.putImageData(strokeSnapshot, 0, 0);
        if(shape.type === 'ellipse'){
          ctx.beginPath();
          ctx.ellipse(shape.cx, shape.cy, shape.rx, shape.ry, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else if(shape.type === 'rect'){
          ctx.strokeRect(shape.cx - shape.rx, shape.cy - shape.ry, shape.rx * 2, shape.ry * 2);
        } else if(shape.type === 'diamond'){
          drawPolygon([
            { x: shape.cx, y: shape.cy - shape.ry },
            { x: shape.cx + shape.rx, y: shape.cy },
            { x: shape.cx, y: shape.cy + shape.ry },
            { x: shape.cx - shape.rx, y: shape.cy }
          ]);
        } else if(shape.type === 'triangle' || shape.type === 'polygon'){
          drawPolygon(shape.points);
        }
      }
    }
    strokePoints = [];
    strokeSnapshot = null;
  }
  canvas.addEventListener('pointerdown', e => {
    drawing = true;
    canvasHasContent[id] = true;
    try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    const p = pos(e);
    lastX = p.x; lastY = p.y;
    strokePoints = [{x: p.x, y: p.y}];
    try { strokeSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height); } catch(err){ strokeSnapshot = null; }
    ctx.beginPath();
    ctx.arc(lastX, lastY, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
    strokePoints.push({x: p.x, y: p.y});
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev =>
    canvas.addEventListener(ev, () => {
      if(drawing) finishStroke();
      drawing = false;
    })
  );

  const handle = document.getElementById(id + '_handle');
  if(handle){
    let resizing = false, startX = 0, startY = 0, startW = 0, startH = 0;
    handle.addEventListener('pointerdown', e => {
      resizing = true;
      startX = e.clientX; startY = e.clientY;
      const rect = wrap.getBoundingClientRect();
      startW = rect.width; startH = rect.height;
      try { handle.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault();
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', e => {
      if(!resizing) return;
      const minW = 240, minH = 190;
      const newW = Math.max(minW, startW + (e.clientX - startX));
      const newH = Math.max(minH, startH + (e.clientY - startY));
      wrap.style.width = newW + 'px';
      wrap.style.height = newH + 'px';
      resizeCanvas(true);
      e.preventDefault();
      e.stopPropagation();
    });
    ['pointerup','pointercancel'].forEach(ev => handle.addEventListener(ev, e => {
      resizing = false;
      e.stopPropagation();
    }));
  }
}

function clearCanvas(id){
  const canvas = document.getElementById(id + '_canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FDFCFE';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  canvasHasContent[id] = false;
}

function getCanvasValue(id){
  if(!canvasHasContent[id]) return '';
  const canvas = document.getElementById(id + '_canvas');
  if(!canvas) return '';
  try { return canvas.toDataURL('image/png'); } catch(e){ return ''; }
}

function loadCanvasValue(id, dataUrl){
  const canvas = document.getElementById(id + '_canvas');
  if(!canvas || !dataUrl || dataUrl.indexOf('data:image') !== 0) return;
  const img = new Image();
  img.onload = () => {
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FDFCFE';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvasHasContent[id] = true;
  };
  img.src = dataUrl;
}

function collectAssessment(){
  const basic2 = {};
  BASIC2_FIELDS.forEach(f => {
    basic2[f.id] = f.type === 'canvas' ? getCanvasValue(f.id) : (document.getElementById(f.id).value || '');
  });
  const life = {};
  LIFE_GROUPS.forEach(g => {
    g.items.forEach(f => {
      let v = document.getElementById(f.id).value || '';
      if(f.hasText){
        const note = document.getElementById(f.id + '_note').value || '';
        if(note) v = v ? (v + ' ／ ' + note) : note;
      }
      life[f.id] = v;
    });
  });
  return {basic2, life};
}

async function exportExcel(){
  const statusEl = document.getElementById('status');
  const name = document.getElementById('a_name').value || '';
  const home = document.getElementById('a_home').value || '';
  const category = document.getElementById('a_category').value || '';
  try{
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('課題分析シート');
    ws.columns = [{ width: 40 }, { width: 80 }];

    const addHeaderRow = (text) => {
      const row = ws.addRow([text, '']);
      ws.mergeCells(row.number, 1, row.number, 2);
      const cell = row.getCell(1);
      cell.font = { bold: true, color: { argb: 'FF6B4E1A' } };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFE7D6' } };
      cell.border = {
        top: { style: 'thin' }, left: { style: 'thin' },
        bottom: { style: 'thin' }, right: { style: 'thin' }
      };
      row.height = 22;
    };

    const addFieldRow = (label, value) => {
      const row = ws.addRow([label, value || '']);
      row.height = 55;
      const labelCell = row.getCell(1);
      const valueCell = row.getCell(2);
      labelCell.font = { bold: true };
      labelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF4F1EA' } };
      labelCell.alignment = { wrapText: true, vertical: 'top' };
      valueCell.alignment = { wrapText: true, vertical: 'top' };
      [labelCell, valueCell].forEach(cell => {
        cell.border = {
          top: { style: 'thin' }, left: { style: 'thin' },
          bottom: { style: 'thin' }, right: { style: 'thin' }
        };
      });
    };

    addHeaderRow('基本情報');
    addFieldRow('ホーム', home);
    addFieldRow('氏名', name);
    addFieldRow('区分', category);

    const addImageFieldRow = (label, dataUrl) => {
      const row = ws.addRow([label, '']);
      row.height = 140;
      const labelCell = row.getCell(1);
      labelCell.font = { bold: true };
      labelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF4F1EA' } };
      labelCell.alignment = { wrapText: true, vertical: 'top' };
      [labelCell, row.getCell(2)].forEach(cell => {
        cell.border = {
          top: { style: 'thin' }, left: { style: 'thin' },
          bottom: { style: 'thin' }, right: { style: 'thin' }
        };
      });
      if(dataUrl){
        const isJpeg = dataUrl.indexOf('data:image/jpeg') === 0;
        const imageId = wb.addImage({ base64: dataUrl, extension: isJpeg ? 'jpeg' : 'png' });
        ws.addImage(imageId, { tl: { col: 1, row: row.number - 1 }, ext: { width: 400, height: 180 } });
      }
    };

    addHeaderRow('基本情報（課題分析シート）');
    const a = collectAssessment();
    BASIC2_FIELDS.forEach(f => {
      if(f.type === 'canvas'){ addImageFieldRow(f.label, a.basic2[f.id]); }
      else { addFieldRow(f.label, a.basic2[f.id]); }
    });
    LIFE_GROUPS.forEach(g => {
      addHeaderRow(g.title);
      g.items.forEach(f => addFieldRow(f.label, a.life[f.id]));
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = (name ? name + '_課題分析シート' : '課題分析シート') + '.xlsx';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    statusEl.textContent = "Excelファイルを出力しました";
    statusEl.className = "status ok";
  } catch(err){
    statusEl.textContent = "Excel出力に失敗しました";
    statusEl.className = "status err";
  }
}

function applyField(f, rawValue){
  if(f.type === 'canvas'){
    loadCanvasValue(f.id, rawValue);
    return;
  }
  const el = document.getElementById(f.id);
  if(!el) return;
  if(f.type === 'select'){
    let selVal = rawValue || '';
    let noteVal = '';
    if(f.hasText && rawValue && rawValue.indexOf(' ／ ') >= 0){
      const parts = rawValue.split(' ／ ');
      if(f.options.indexOf(parts[0]) >= 0){
        selVal = parts[0];
        noteVal = parts.slice(1).join(' ／ ');
      } else {
        selVal = '';
        noteVal = rawValue;
      }
    } else if(f.options.indexOf(rawValue) < 0){
      selVal = '';
      noteVal = rawValue || '';
    }
    el.value = selVal;
    if(f.hasText){
      const note = document.getElementById(f.id + '_note');
      if(note) note.value = noteVal;
    }
  } else {
    el.value = rawValue || '';
  }
}

}

function jsonpRequest(url){
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    const script = document.createElement('script');
    let done = false;
    window[cbName] = function(data){
      done = true;
      resolve(data);
      cleanup();
    };
    function cleanup(){
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    script.onerror = function(){
      if(!done){ reject(new Error('jsonp failed')); cleanup(); }
    };
    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(() => { if(!done){ reject(new Error('jsonp timeout')); cleanup(); } }, 8000);
  });
}

async function loadAssessmentData(name){
  const statusEl = document.getElementById('status');
  const url = getWebappUrl();
  if(!url || !name){
    clearAllAssessmentFields();
    return;
  }
  statusEl.textContent = "前回の記録を確認中…";
  statusEl.className = "status";
  try{
    const json = await jsonpRequest(url + '?mode=load_assessment&name=' + encodeURIComponent(name));
    clearAllAssessmentFields();
    if(json && json.found && json.rows){
      const map = {};
      json.rows.forEach(pair => { map[pair[0]] = pair[1]; });
      BASIC2_FIELDS.forEach(f => {
        if(map.hasOwnProperty(f.label)) applyField(f, map[f.label]);
      });
      LIFE_GROUPS.forEach(g => {
        g.items.forEach(f => {
          if(map.hasOwnProperty(f.label)) applyField(f, map[f.label]);
        });
      });
      statusEl.textContent = "前回の課題分析シートの記録を読み込みました";
      statusEl.className = "status ok";
    } else {
      statusEl.textContent = "この方の今月の課題分析シート記録はまだありません（新規入力）";
      statusEl.className = "status";
    }
  } catch(err){
    clearAllAssessmentFields();
    statusEl.textContent = "前回の記録の読み込みに失敗しました。通信環境をご確認ください（このまま新規入力もできます）";
    statusEl.className = "status err";
  }
}

function saveData(){
  const url = getWebappUrl();
  const statusEl = document.getElementById('status');
  const name = document.getElementById('a_name').value.trim();
  if(!url){
    statusEl.textContent = "保存先URLが未設定です（開発者に連絡してください）";
    statusEl.className = "status err";
    return;
  }
  if(!name){
    statusEl.textContent = "氏名が未入力です（ICF入力アプリと同じ氏名を入力してください）";
    statusEl.className = "status err";
    return;
  }
  statusEl.textContent = "保存中…";
  statusEl.className = "status";
  const data = { mode: 'assessment', name: name, home: document.getElementById('a_home').value, category: document.getElementById('a_category').value, extraRows: buildExtraRows() };
  fetch(url, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(data)
  }).then(() => {
    statusEl.textContent = "保存しました（" + new Date().toLocaleString('ja-JP') + "）";
    statusEl.className = "status ok";
  }).catch(() => {
    statusEl.textContent = "保存に失敗しました。通信環境を確認してください";
    statusEl.className = "status err";
  });
}
